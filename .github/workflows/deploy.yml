name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Previously merged full SHA (explicit rollback only)
        required: false
        type: string

concurrency:
  group: memos-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, memos-production]
    timeout-minutes: 90
    environment:
      name: production
      url: https://jays-vm.tailade3f5.ts.net:8450

    steps:
      - name: Select newest main SHA
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          api_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          main_sha="$(curl --fail --silent --show-error "${api_headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"

          is_ancestor() {
            local base="$1" head="$2" status
            status="$(curl --fail --silent --show-error "${api_headers[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${base}...${head}" | jq -r '.status')"
            [ "$status" = 'ahead' ] || [ "$status" = 'identical' ]
          }

          requested="${REQUESTED_SHA:-}"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'rollback SHA must be full lowercase hex' >&2
              exit 1
            }
            is_ancestor "$requested" "$main_sha" || {
              echo "rollback SHA is not an ancestor of main" >&2
              exit 1
            }
            selected="$requested"
          else
            selected="$main_sha"
          fi

          deployed="$(jq -r '.sha // empty' /var/lib/memos/deploy-state.json 2>/dev/null || true)"
          skip=false
          if [ -z "$requested" ] && [ -n "$deployed" ]; then
            is_ancestor "$deployed" "$selected" || {
              echo "refusing implicit downgrade from $deployed to $selected" >&2
              exit 1
            }
            [ "$deployed" = "$selected" ] && skip=true
          fi

          echo "sha=$selected" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Selected $selected"

      - name: Wait for main test workflows
        if: github.event_name == 'push' && steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          api_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          for workflow in backend-tests.yml frontend-tests.yml; do
            conclusion=""
            for attempt in {1..90}; do
              run="$(curl --fail --silent --show-error "${api_headers[@]}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=push&head_sha=${RELEASE_SHA}&per_page=10")"
              status="$(jq -r '.workflow_runs[0].status // "waiting"' <<< "$run")"
              conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<< "$run")"
              echo "$workflow: $status${conclusion:+ ($conclusion)}"
              [ "$status" = completed ] && break
              sleep 20
            done
            [ "$conclusion" = success ] || {
              echo "$workflow did not complete successfully for $RELEASE_SHA" >&2
              exit 1
            }
          done

      - name: Build and deploy exact release
        if: steps.release.outputs.skip != 'true'
        run: sudo /usr/local/sbin/memos-deploy '${{ steps.release.outputs.sha }}' "$GITHUB_RUN_ID"

      - name: Verify production health and frontend
        run: |
          set -euo pipefail
          curl --noproxy '*' --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://jays-vm.tailade3f5.ts.net:8450/healthz
          frontend="$(curl --noproxy '*' --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://jays-vm.tailade3f5.ts.net:8450/)"
          ! grep -Fq 'No embeddable frontend found.' <<< "$frontend"
          grep -Fq '<script' <<< "$frontend"

      - name: Capture deployment state
        if: always()
        run: |
          if [ -f /var/lib/memos/deploy-state.json ]; then
            {
              echo '### Memos production state'
              echo
              echo '```json'
              jq . /var/lib/memos/deploy-state.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
